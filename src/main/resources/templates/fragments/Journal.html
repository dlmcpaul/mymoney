<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="InvestmentAccountInput (id, label, value)" class="ui input right icon">
    <input th:id="|${id}-input|" name="accounts" placeholder="Code"
           th:attr="hx-get=|@{/search/investment}?id=${id}&label=${label}|, hx-target=|#${id}-list|, hx-select=|#${id}-list|, list=|${id}-list|"
           th:value="${value}"
           hx-on="updateValue -> this.value = value"
           hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
           hx-swap="outerHTML" type="search"
    >
    <i class="dropdown icon"></i>
</div>

<div th:fragment="StandardAccountInput (id, label, value)" class="ui input right icon">
    <input th:id="|${id}-input|" name="accounts" placeholder="Account"
           th:attr="hx-get=|@{/search/account}?id=${id}&label=${label}|, hx-target=|#${id}-list|, hx-select=|#${id}-list|, list=|${id}-list|"
           th:value="${value}"
           hx-on="updateValue -> this.value = value"
           hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
           hx-swap="outerHTML" type="search"
    >
    <i class="dropdown icon"></i>
</div>

<div th:fragment="InvestmentAccountInputField (id, label, value, accounts, showError)" th:attr="id=${id}"
     th:class="${showError} ? 'ten wide required error field' : 'ten wide required field'">
    <label th:for="|${id}-input|" th:text="${label}">Account</label>
    <div th:replace="~{fragments/Journal :: InvestmentAccountInput (${id}, ${label}, ${value})}"></div>
    <datalist th:id="|${id}-list|">
        <option th:each="account : ${accounts}" th:value="${account}">
    </datalist>
</div>

<div th:fragment="AccountInputField (id, label, value, accounts, showError)" th:attr="id=${id}"
     th:class="${showError} ? 'ten wide required error field' : 'ten wide required field'">
    <label th:for="|${id}-input|" th:text="${label}">Account</label>
    <div th:replace="~{fragments/Journal :: StandardAccountInput (${id}, ${label}, ${value})}"></div>
    <datalist th:id="|${id}-list|">
        <option th:each="account : ${accounts}" th:value="${account}">
    </datalist>
</div>

<div th:fragment="DescriptionInputField (id, label, value, descriptions, showError)"
     th:attr="id=${id}"
     th:class="${showError} ? 'required warning field' : 'required field'" id="DescriptionInputField">
    <label th:for="|${id}-input|" for="desc-id" th:text="${label}">Why</label>
    <div class="ui input right icon">
        <input id="desc-id" th:id="|${id}-input|" name="description" placeholder="Description"
               th:attr="hx-get=|@{/search/description}?id=${id}&label=${label}|, hx-target=|#${id}-list|, hx-select=|#${id}-list|, list=|${id}-list|"
               th:value="${value}"
               hx-select-oob="#from-account,#to-account"
               hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
               hx-on="updateValue -> this.value = value"
               hx-swap="outerHTML" type="search"
        >
        <i class="dropdown icon"></i>
    </div>
    <datalist th:id="|${id}-list|">
        <option th:each="description : ${descriptions}" th:value="${description}">
    </datalist>
</div>

<div th:fragment="DateInputField (defaultDate)" class="eight wide required field">
    <label for="txn-date">When</label>
    <div class="ui calendar" id="type_calendar" data-type="date" th:attr="data-date=${defaultDate}">
        <div class="ui input left icon">
            <input name="journalDate" id="txn-date" type="date" placeholder="Date" th:value="${defaultDate}">
            <i class="calendar icon"></i>
        </div>
    </div>
</div>

<div th:fragment="AmountInputField (id, label, isRequired)" class="six wide field"
     th:attrprepend="class=${isRequired} ? 'required ' : _">
    <label th:text="${label}">Amount</label>
    <div class="ui labeled input">
        <label th:for="${id}" class="ui label">$</label>
        <input name="amounts" type="number" step="any" placeholder="100.00" th:id="${id}">
    </div>
</div>

<div th:fragment="DistributionButtons (activeButton)" class="required field" id="DistributionButtons">
    <label>Distribution Type</label>
    <div class="three ui buttons" th:with="buttons=${#arrays.toStringArray('distribution,capital-gain,capital-return'.split(','))}">
        <input type="hidden" th:value="${activeButton}" name="distributionType">
        <div th:each="button : ${buttons}" th:class="${activeButton eq button} ? 'ui active button' : 'ui button'"
             th:attr="hx-get=|@{/journal/distribution-type}?button=${button}|" hx-target="#DistributionButtons"
             th:text="${#strings.capitalizeWords(#strings.replace(button,'-',' '))}">}"
        >
        </div>
    </div>
</div>

<form th:fragment="BasicJournal (defaultDate)" class="ui form"
      th:attr="hx-post=|@{/journal/basic}|" hx-swap="outerHTML"
      hx-on="resetForm -> this.reset()"
      hx-target="this" hx-select-oob="#BalanceSheet,#IncomeExpenseHeader,#IncomeExpenseBody"
      id="NewJournalForm">
    <div th:replace="~{fragments/Journal :: DateInputField (${defaultDate})}"></div>
    <div th:replace="~{fragments/Journal :: DescriptionInputField ('journal-desc', 'Why', '', null, false)}"></div>
    <div class="two fields">
        <div th:replace="~{fragments/Journal :: AccountInputField ('from-account', 'From Account', '', null, false)}"></div>
        <div th:replace="~{fragments/Journal :: AmountInputField ('basic-amount', 'Amount', true)}"></div>
    </div>
    <div class="fields">
        <div th:replace="~{fragments/Journal :: AccountInputField ('to-account', 'To Account', '', null, false)}"></div>
    </div>
    <button type="submit" class="ui right floated compact primary submit button"><i class="comment dollar icon"></i>Post
    </button>
</form>

<form th:fragment="DividendJournal (defaultDate, defaultFrankingAccount)" class="ui form"
      th:attr="hx-post=|@{/journal/dividend}|" hx-swap="outerHTML"
      hx-target="this" hx-select-oob="#BalanceSheet,#IncomeExpenseHeader,#IncomeExpenseBody"
      hx-on="resetForm -> this.reset()"
      id="NewDividendForm">
    <div th:replace="~{fragments/Journal :: DateInputField (${defaultDate})}"></div>
    <div class="two fields">
        <div th:replace="~{fragments/Journal :: InvestmentAccountInputField ('investment', 'Investment', '', null, false)}"></div>
        <div th:replace="~{fragments/Journal :: AmountInputField ('franked-amount','Franked Dividend', true)}"></div>
    </div>
    <div class="two fields">
        <div th:replace="~{fragments/Journal :: AccountInputField ('dividend-disb', 'Deposit Account', '', null, false)}"></div>
        <div th:replace="~{fragments/Journal :: AmountInputField ('unfranked-amount','Unfranked Dividend', true)}"></div>
    </div>
    <div class="two fields">
        <div th:replace="~{fragments/Journal :: AccountInputField ('franking-credit', 'Franking Credit Account', ${defaultFrankingAccount}, null, false)}"></div>
        <div th:replace="~{fragments/Journal :: AmountInputField ('franked-credit-amount','Franking Credit', true)}"></div>
    </div>
    <button type="submit" class="ui right floated compact primary submit button">
        <i class="comment dollar icon"></i>Post
    </button>
</form>

<form th:fragment="DistributionJournal (defaultDate, activeButton)" class="ui form"
      th:attr="hx-post=|@{/journal/distribution}|" hx-swap="outerHTML"
      hx-on="resetForm -> this.reset()"
      hx-target="this" hx-select-oob="#BalanceSheet,#IncomeExpenseHeader,#IncomeExpenseBody"
      id="NewFundIncomeForm">
    <div th:replace="~{fragments/Journal :: DateInputField (${defaultDate})}"></div>
    <div th:replace="~{fragments/Journal :: DistributionButtons (${activeButton})}"></div>
    <div class="two fields">
        <div th:replace="~{fragments/Journal :: AccountInputField ('fund-distribution', 'Fund Account', '', null, false)}"></div>
        <div th:replace="~{fragments/Journal :: AmountInputField ('distribution-amount','Amount', true)}"></div>
    </div>
    <div class="fields">
        <div th:replace="~{fragments/Journal :: AccountInputField ('fund-income-disb', 'Disbursement Account', '', null, false)}"></div>
        <div class="field"></div>
    </div>
    <button type="submit" class="ui right floated compact primary submit button"><i class="comment dollar icon"></i>Post
    </button>
</form>

<div id="JournalTabs" th:fragment="JournalTabs (entryDate, defaultFrankingAccount)" th:remove="tag">
    <div class="ui bottom attached active tab segment" data-tab="one">
        <div class="ui padded basic segment">
            <div th:replace="~{fragments/Journal :: BasicJournal (${entryDate})}"></div>
        </div>
    </div>
    <div class="ui bottom attached tab segment" data-tab="two">
        <div class="ui padded basic segment">
            <div th:replace="~{fragments/Journal :: DividendJournal (${entryDate}, ${defaultFrankingAccount})}"></div>
        </div>
    </div>
    <div class="ui bottom attached tab segment" data-tab="three">
        <div class="ui padded basic segment">
            <div th:replace="~{fragments/Journal :: DistributionJournal (${entryDate}, 'distribution')}"></div>
        </div>
    </div>
</div>

<div id="JournalForms" th:fragment="JournalForms (entryDate, defaultFrankingAccount)" class="ui basic fitted segment">
    <div class="ui top attached tabular menu" id="journal-tabs">
        <div class="active item" data-tab="one" id="journal-tab-item-1">Journal Entry</div>
        <div class="center item" data-tab="two" id="journal-tab-item-2">Dividend Income</div>
        <div class="item" data-tab="three" id="journal-tab-item-3">Fund Income</div>
    </div>
    <div th:replace="~{fragments/Journal :: JournalTabs (${entryDate}, ${defaultFrankingAccount})}"></div>
</div>

</body>
</html>
