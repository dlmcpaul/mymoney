<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(header, content, menucode)" lang="en"
      th:with="scripts=${scripts?:null}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="My Money Visualiser">
    <title>My Money Visualiser</title>
    <link rel="stylesheet" th:href="@{/_static/fomantic-ui-css/2.9.4/semantic.min.css}">
    <script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/_static/fomantic-ui-css/2.9.4/semantic.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/htmx.org/dist/htmx.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/chart.js/dist/chart.umd.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/chartjs-plugin-datalabels/dist/chartjs-plugin-datalabels.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/chartjs-plugin-annotation/dist/chartjs-plugin-annotation.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/idiomorph/dist/idiomorph-ext.min.js}"></script>
</head>
<body hx-ext="morph" th:attr="onload=${scripts != null} ? 'onPageLoad()' : _">
<div class="ui wide container">
    <div th:replace="~{fragments/Common :: Banner}"></div>
    <th:block th:replace="${header}"/>
    <!--/*@thymesVar id="menuList" type="java.util.List<com.hz.mymoney.ui.models.internal.Menu>"*/-->
    <div th:replace="~{fragments/Common :: PrimaryTabs(${menucode}, ${menuList})}"></div>
    <div class="ui raised padded segment">
        <div th:replace="~{fragments/Common :: PrimaryMenu(${menucode}, ${menuList})}"></div>
        <th:block th:replace="${content}"/>
    </div>
</div>
<th:block th:if="${scripts != null}">
    <th:block th:replace="${scripts}"/>
</th:block>
<link rel="stylesheet" data-th-href="@{/css/default.css}"/>
</body>
</html>
